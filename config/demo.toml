# Estudio de la DEMO pública (RF-DEMO-*). Se recarga cada noche. Plan Básico por defecto.
# Úsalo con ESTUDIO_CONFIG=config/demo.toml y DEMO=true (ver docs/demo.md).
#

[estudio]
nombre = "Estudio Pilates (demo)"
zona_horaria = "Europe/Madrid"
idioma = "es"
direccion = "Calle Ejemplo 1, 28001 Madrid"
telefono_contacto = "+34600000000"
web = "https://example.com"
google_review_url = "https://g.page/r/EJEMPLO/review"
# Plan contratado (RF-PLAN-001): "basico" = menús y botones, sin IA · "ia" = menús + IA
plan = "basico"
# Tono para los prompts: cercano | profesional | divertido
tono = "cercano"

[politicas]
cancelacion_horas_limite = 12        # RF-RES-005
cancelacion_tardia = "pierde_sesion" # pierde_sesion | sin_penalizacion
lista_espera_horas_para_aceptar = 2  # RF-RES-004
max_reservas_futuras = 8
congelacion_permitida = true         # RF-CLI-007
congelacion_max_dias = 30
inactividad_dias = 21                # RF-MKT-002
recordatorios_horas_antes = [24, 2]  # RF-MKT-001

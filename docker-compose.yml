services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pilates
      POSTGRES_PASSWORD: pilates
      POSTGRES_DB: pilates
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pilates:pilates@db:5432/pilates
      REDIS_URL: redis://redis:6379/0
    command: scripts/arranque.sh web
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pilates:pilates@db:5432/pilates
      REDIS_URL: redis://redis:6379/0
    command: scripts/arranque.sh worker
    depends_on: [db, redis]
volumes:
  pgdata:
